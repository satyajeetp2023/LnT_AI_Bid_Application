name: Release Readiness

on:
  workflow_dispatch:
  push:
    branches:
      - codex/phase-2-pre-bid-queries

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: railway
          POSTGRES_PASSWORD: release-test-password
          POSTGRES_DB: railway_bid
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U railway -d railway_bid"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgresql+psycopg://railway:release-test-password@localhost:5432/railway_bid
      STORAGE_ROOT: /tmp/railway-bid-release-storage
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit

      - name: Validate production configuration
        working-directory: backend
        env:
          ENVIRONMENT: production
          SECRET_KEY: 0123456789abcdef0123456789abcdef
          DATABASE_URL: postgresql+psycopg://railway:release-test-password@localhost:5432/railway_bid
          CORS_ORIGINS: https://bid-intelligence.example.internal
          AUTH_MODE: oidc
          OIDC_ISSUER: https://identity.example.internal/
          OIDC_AUDIENCE: railway-bid-intelligence
          OIDC_JWKS_URL: https://identity.example.internal/.well-known/jwks.json
        run: |
          PYTHONPATH=. python - <<'PY'
          from app.core.config import Settings
          settings=Settings()
          assert settings.environment=="production"
          assert len(settings.secret_key)>=32
          assert settings.cors_origin_list==["https://bid-intelligence.example.internal"]
          assert settings.auth_mode=="oidc"
          assert settings.oidc_jwks_url.startswith("https://")
          print("production configuration validation passed")
          PY

      - name: Apply migrations
        working-directory: backend
        run: PYTHONPATH=. alembic upgrade head

      - name: Verify Phase 1-9 schema
        working-directory: backend
        run: |
          PYTHONPATH=. python - <<'PY'
          from sqlalchemy import inspect
          from app.database.session import engine
          required={
            "roles","users","bid_projects","bid_documents","bid_requirements","bid_missing_inputs",
            "bid_pre_bid_queries","planning_resource_entries","planning_package_findings",
            "bid_outcomes","bid_price_records","execution_outcomes","execution_learning_factors"
          }
          with engine.connect() as conn:
              tables=set(inspect(conn).get_table_names())
          missing=required-tables
          assert not missing,f"Missing migrated tables: {sorted(missing)}"
          print(f"schema verification passed: {len(tables)} tables")
          PY

      - name: Migration rollback and reapply smoke
        working-directory: backend
        run: |
          PYTHONPATH=. alembic downgrade 0021
          PYTHONPATH=. alembic upgrade head

      - name: Backend dependency audit
        working-directory: backend
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Backend regression tests
        working-directory: backend
        run: |
          PYTHONPATH=. pytest -q app/tests
          PYTHONPATH=. pytest -q tests

      - name: PostgreSQL internal UAT
        working-directory: backend
        run: |
          PYTHONPATH=. python -m app.seed
          PYTHONPATH=. pytest -q uat

      - name: API performance and concurrency smoke
        working-directory: backend
        env:
          ENVIRONMENT: development
          AUTH_MODE: development
        run: |
          PYTHONPATH=. uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/perf-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null; then break; fi
            sleep 1
          done
          PERF_REQUESTS=120 PERF_CONCURRENCY=12 PERF_P95_MS=750 PYTHONPATH=. python release/performance_smoke.py

      - name: Database dependency failure and recovery smoke
        working-directory: backend
        env:
          ENVIRONMENT: development
          AUTH_MODE: development
        run: |
          PYTHONPATH=. uvicorn app.main:app --host 127.0.0.1 --port 8001 >/tmp/recovery-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8001/api/v1/health/ready >/dev/null; then break; fi
            sleep 1
          done
          PG_CONTAINER=$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -n1)
          test -n "$PG_CONTAINER"
          docker pause "$PG_CONTAINER"
          curl -fsS --max-time 3 http://127.0.0.1:8001/api/v1/health/live >/dev/null
          if curl -fsS --max-time 3 http://127.0.0.1:8001/api/v1/health/ready >/dev/null 2>&1; then
            echo "readiness unexpectedly succeeded while PostgreSQL was paused"
            docker unpause "$PG_CONTAINER"
            exit 1
          fi
          docker unpause "$PG_CONTAINER"
          for i in {1..30}; do
            if curl -fsS --max-time 3 http://127.0.0.1:8001/api/v1/health/ready >/dev/null; then
              echo "database recovery readiness passed"
              exit 0
            fi
            sleep 1
          done
          echo "readiness did not recover after PostgreSQL resumed"
          exit 1

      - name: Storage durability and traversal smoke
        working-directory: backend
        run: PYTHONPATH=. python release/storage_durability_smoke.py

      - name: PostgreSQL backup and restore smoke
        env:
          PGPASSWORD: release-test-password
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          pg_dump -h localhost -U railway -d railway_bid --no-owner --no-privileges > /tmp/railway_bid.sql
          test -s /tmp/railway_bid.sql
          createdb -h localhost -U railway railway_bid_restore
          psql -h localhost -U railway -d railway_bid_restore -v ON_ERROR_STOP=1 -f /tmp/railway_bid.sql >/tmp/restore.log
          COUNT=$(psql -h localhost -U railway -d railway_bid_restore -Atc "select count(*) from alembic_version")
          test "$COUNT" = "1"
          TABLE_COUNT=$(psql -h localhost -U railway -d railway_bid_restore -Atc "select count(*) from information_schema.tables where table_schema='public'")
          test "$TABLE_COUNT" -ge 13
          echo "backup/restore verified with $TABLE_COUNT public tables"

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Frontend regression tests
        working-directory: frontend
        run: npm test

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Build backend container
        run: docker build -t railway-bid-backend:release-test ./backend

      - name: Backend container runtime smoke
        env:
          PGPASSWORD: release-test-password
        run: |
          docker run -d --name railway-bid-backend-smoke --network host \
            -e ENVIRONMENT=production \
            -e SECRET_KEY=0123456789abcdef0123456789abcdef \
            -e DATABASE_URL=postgresql+psycopg://railway:release-test-password@127.0.0.1:5432/railway_bid \
            -e STORAGE_ROOT=/tmp/railway-bid-container-storage \
            -e CORS_ORIGINS=https://bid-intelligence.example.internal \
            -e AUTH_MODE=oidc \
            -e OIDC_ISSUER=https://identity.example.internal/ \
            -e OIDC_AUDIENCE=railway-bid-intelligence \
            -e OIDC_JWKS_URL=https://identity.example.internal/.well-known/jwks.json \
            railway-bid-backend:release-test
          trap 'docker rm -f railway-bid-backend-smoke >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/ready >/dev/null; then
              echo "backend container runtime smoke passed"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health/ready >/dev/null
          docker rm -f railway-bid-backend-smoke >/dev/null
          trap - EXIT

      - name: Build frontend container
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://bid-api.example.internal/api/v1 \
            --build-arg NEXT_PUBLIC_AUTH_MODE=oidc \
            --build-arg NEXT_PUBLIC_OIDC_AUTHORITY=https://identity.example.internal \
            --build-arg NEXT_PUBLIC_OIDC_CLIENT_ID=railway-bid-intelligence-spa \
            --build-arg NEXT_PUBLIC_OIDC_REDIRECT_URI=https://bid-intelligence.example.internal/auth/callback \
            --build-arg NEXT_PUBLIC_OIDC_SCOPE="openid profile email" \
            -t railway-bid-frontend:release-test ./frontend

      - name: Frontend container runtime smoke
        run: |
          docker run -d --name railway-bid-frontend-smoke -p 3000:3000 railway-bid-frontend:release-test
          trap 'docker rm -f railway-bid-frontend-smoke >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              echo "frontend container runtime smoke passed"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000 >/dev/null
          docker rm -f railway-bid-frontend-smoke >/dev/null
          trap - EXIT

      - name: Runtime smoke backend container
        env:
          PGPASSWORD: release-test-password
        run: |
          docker run -d --name railway-bid-backend-smoke --network host \
            -e ENVIRONMENT=development \
            -e DATABASE_URL=postgresql+psycopg://railway:release-test-password@localhost:5432/railway_bid \
            -e STORAGE_ROOT=/tmp/release-smoke-storage \
            railway-bid-backend:release-test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/ready >/tmp/backend-ready.json; then break; fi
            sleep 2
          done
          cat /tmp/backend-ready.json
          grep -q '"status":"ready"' /tmp/backend-ready.json
          docker rm -f railway-bid-backend-smoke

      - name: Runtime smoke frontend container
        run: |
          docker run -d --name railway-bid-frontend-smoke --network host railway-bid-frontend:release-test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/frontend-home.html; then break; fi
            sleep 2
          done
          test -s /tmp/frontend-home.html
          docker rm -f railway-bid-frontend-smoke

      - name: Validate compose model
        run: docker compose config >/tmp/compose.rendered.yml
