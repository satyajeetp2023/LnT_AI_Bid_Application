name: Internal CI

on:
  push:
    branches:
      - codex/phase-2-pre-bid-queries
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Backend dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt --progress-spinner off
      - name: API regression tests
        run: PYTHONPATH=. pytest -q app/tests
      - name: Service regression tests
        run: PYTHONPATH=. pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Critical dependency audit
        run: npm audit --audit-level=critical
      - run: npm test
      - run: npm run build
