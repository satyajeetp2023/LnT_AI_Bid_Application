name: Generate Frontend Lockfile

on:
  push:
    branches:
      - codex/phase-2-pre-bid-queries
    paths:
      - .github/workflows/generate-frontend-lockfile.yml
      - frontend/package.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: codex/phase-2-pre-bid-queries

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      - name: Generate lockfile if missing
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json already exists"
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "No lockfile change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "Add reproducible frontend dependency lockfile"
          git push origin HEAD:codex/phase-2-pre-bid-queries
