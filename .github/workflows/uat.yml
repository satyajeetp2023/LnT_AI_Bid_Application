name: Internal UAT

on:
  push:
    branches:
      - codex/phase-2-pre-bid-queries
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: railway
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: railway_bid
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U railway -d railway_bid"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgresql+psycopg://railway:change-me@localhost:5432/railway_bid
      STORAGE_ROOT: /tmp/railway-bid-uat-storage
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. alembic upgrade head
      - name: Verify migrated schema through application connection
        run: |
          PYTHONPATH=. python - <<'PY'
          from sqlalchemy import inspect,text
          from app.database.session import engine
          with engine.connect() as conn:
              db=conn.execute(text("select current_database()")).scalar_one()
              tables=set(inspect(conn).get_table_names())
              print(f"database={db}; tables={len(tables)}")
              required={"roles","users","bid_projects","bid_documents","bid_requirements","bid_missing_inputs","bid_pre_bid_queries","planning_resource_entries","planning_package_findings","bid_outcomes","bid_price_records","execution_outcomes","execution_learning_factors","bid_decision_snapshots"}
              missing=required-tables
              assert not missing,f"Missing migrated tables: {sorted(missing)}"
          PY
      - run: PYTHONPATH=. python -m app.seed
      - run: PYTHONPATH=. pytest -q uat
